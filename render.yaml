services:
  - type: web
    name: cheapfood-project
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --preload --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: FLASK_DEBUG
        value: "False"
      - key: DEMO_MODE
        value: "True"
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: "https://cheap-food-project.vercel.app"
      - key: CORS_ORIGINS
        value: "https://cheap-food-project.vercel.app,https://cheap-food.altvia.cloud"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
